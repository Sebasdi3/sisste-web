<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISSTe - Inicio de Sesion</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/base.css">
    
    <style>
        body {
            background-color: #0f172a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .titulo-login {
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .form-control {
            background: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid #334155 !important;
            color: white !important;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 1) !important;
            border-color: #38bdf8 !important;
            color: white !important;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
        .input-group-text {
            background-color: #212529 !important;
            border: 1px solid #6c757d !important;
            color: #0dcaf0 !important;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #38bdf8;
            border: none;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="titulo-neon">SISSTe</h1>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-white small">Cedula de Identidad</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person-badge"></i>
                    </span>
                    <input type="text" id="cedula" class="form-control" placeholder="Ingrese su cedula" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-white small">Contrase&ntilde;a</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="password" class="form-control" placeholder="********" required>
                    <span class="input-group-text" id="togglePassword">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">INICIAR SESION</button>
        </form>
        
        <p class="text-center mt-4 mb-0 text-secondary small">
            Sistema Interno para Solicitudes de Soporte Tecnico
        </p>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('bi-eye');
            eyeIcon.classList.toggle('bi-eye-slash');
        });
    </script>
    <script src="/js/app.js"></script>
</body>
</html>
