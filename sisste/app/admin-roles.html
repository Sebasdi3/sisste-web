<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISSTe - Administración de Roles</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/solicitud-panel.css">
    <link rel="stylesheet" href="/css/admin-users.css">

    <style>
        .rol-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .rol-row.inactivo { opacity: 0.5; }
        .rol-row .clave {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .permiso-check { margin-right: 12px; }
        .form-check-label { color: #ffffff !important; }
        .rol-core-badge {
            font-size: 0.7rem;
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid #f87171;
            padding: 2px 8px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container-fluid mt-3">
        <h1 class="titulo-neon">Gestión de Roles</h1>

        <div class="d-flex justify-content-end px-4 mb-3">
            <a href="/admin-users.html" class="btn btn-outline-light btn-sm shadow me-2">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
            <a href="/admin-papelera.html" class="btn btn-outline-secondary btn-sm shadow me-2">
                <i class="bi bi-trash3 me-1"></i> Papelera
            </a>
            <div class="me-3 text-white d-flex align-items-center">
                <i class="bi bi-person-badge me-2 text-info"></i>
                <span id="nombreUsuarioNavbar" class="small fw-bold">Administrador</span>
            </div>
            <button onclick="window.cerrarSesion()" class="btn btn-danger btn-sm shadow">Cerrar Sesión</button>
        </div>

        <div class="row px-3">
            <div class="col-lg-4 mb-4">
                <div class="card p-4 h-100 shadow">
                    <h3 class="mb-4 text-white">Nuevo Rol</h3>
                    <form id="formNuevoRol">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-white small">NOMBRE A MOSTRAR</label>
                            <input type="text" id="nombreMostrar" class="form-control admin-form-input" placeholder="Ej. Supervisor de Piso" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-white small">CLAVE INTERNA</label>
                            <input type="text" id="clave" class="form-control admin-form-input" placeholder="ej. supervisor (sin espacios)" required>
                            <small class="text-white-50">Se usa internamente, no la ve el usuario.</small>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold text-white small d-block">PERMISOS</label>
                            <div class="form-check permiso-check-item">
                                <input class="form-check-input" type="checkbox" value="ver_solicitudes" id="permVerSolicitudes">
                                <label class="form-check-label small" for="permVerSolicitudes">Ver solicitudes</label>
                            </div>
                            <div class="form-check permiso-check-item">
                                <input class="form-check-input" type="checkbox" value="gestionar_tickets" id="permGestionarTickets">
                                <label class="form-check-label small" for="permGestionarTickets">Gestionar tickets (aceptar/finalizar)</label>
                            </div>
                            <div class="form-check permiso-check-item">
                                <input class="form-check-input" type="checkbox" value="ver_dashboard" id="permVerDashboard">
                                <label class="form-check-label small" for="permVerDashboard">Ver dashboard técnico</label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow">CREAR ROL</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8 mb-4">
                <div class="card p-4 h-100 shadow">
                    <h3 class="mb-4 text-white">Roles del Sistema</h3>
                    <p class="text-white-50 small">Los roles principales (Usuario, Técnico, Administrador) son parte fija del sistema y no se pueden eliminar.</p>
                    <div id="listaRolesCore" class="mb-4"></div>
                    <hr class="border-secondary opacity-25">
                    <h5 class="text-info mt-3">Roles Personalizados</h5>
                    <div id="listaRolesPersonalizados"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/app.js"></script>
    <script src="/js/admin-roles.js"></script>
</body>
</html>
