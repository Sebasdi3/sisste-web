<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISSTe - Papelera</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/solicitud-panel.css">
    <link rel="stylesheet" href="/css/admin-users.css">

    <style>
        .papelera-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .tipo-badge {
            font-size: 0.7rem;
            background-color: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <div class="container-fluid mt-3">
        <h1 class="titulo-neon">Papelera</h1>

        <div class="d-flex justify-content-end px-4 mb-3">
            <a href="/admin-users.html" class="btn btn-outline-light btn-sm shadow me-2">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
            <div class="me-3 text-white d-flex align-items-center">
                <i class="bi bi-person-badge me-2 text-info"></i>
                <span id="nombreUsuarioNavbar" class="small fw-bold">Administrador</span>
            </div>
            <button onclick="window.cerrarSesion()" class="btn btn-danger btn-sm shadow">Cerrar Sesión</button>
        </div>

        <div class="row px-3">
            <div class="col-12 mb-4">
                <div class="card p-4 shadow">
                    <h3 class="mb-4 text-white">Elementos Eliminados</h3>
                    <p class="text-white-50 small">Puedes restaurarlos, o eliminarlos permanentemente.</p>
                    <div id="listaPapelera"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/app.js"></script>
    <script src="/js/admin-papelera.js"></script>
</body>
</html>
