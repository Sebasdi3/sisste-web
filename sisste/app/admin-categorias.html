<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISSTe - Administración de Categorías</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/solicitud-panel.css">
    <link rel="stylesheet" href="/css/admin-users.css">

    <style>
        .categoria-card {
            background-color: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .categoria-card.inactiva {
            opacity: 0.5;
        }
        .categoria-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .subcategoria-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 6px;
        }
        .subcategoria-row.inactiva {
            opacity: 0.5;
        }
        .badge-texto-libre {
            font-size: 0.7rem;
            background-color: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="container-fluid mt-3">
        <h1 class="titulo-neon">Gestión de Categorías SISSTe</h1>

        <div class="d-flex justify-content-end px-4 mb-3">
            <a href="/admin-users.html" class="btn btn-outline-light btn-sm shadow me-2">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
            <div class="me-3 text-white d-flex align-items-center">
                <i class="bi bi-person-badge me-2 text-info"></i>
                <span id="nombreUsuarioNavbar" class="small fw-bold">Administrador</span>
            </div>
            <button onclick="window.cerrarSesion()" class="btn btn-danger btn-sm shadow">Cerrar Sesión</button>
        </div>

        <div class="row px-3">
            <div class="col-lg-4 mb-4">
                <div class="card p-4 h-100 shadow">
                    <h3 class="mb-4 text-white">Nueva Categoría</h3>
                    <form id="formNuevaCategoria">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-white small">NOMBRE</label>
                            <input type="text" id="nombreCategoria" class="form-control admin-form-input" placeholder="Ej. Telefonía" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow">AGREGAR CATEGORÍA</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8 mb-4">
                <div class="card p-4 h-100 shadow">
                    <h3 class="mb-4 text-white">Categorías y Sub-opciones</h3>
                    <div id="listaCategoriasAdmin"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal para agregar sub-categoría -->
    <div class="modal fade" id="modalNuevaSub" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-info">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-info"><i class="bi bi-plus-circle me-2"></i>Nueva Sub-opción</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="formNuevaSub">
                    <div class="modal-body">
                        <input type="hidden" id="subCategoriaIdPadre">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">NOMBRE</label>
                            <input type="text" id="nombreSub" class="form-control admin-form-input" required>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="permiteTextoLibreSub">
                            <label class="form-check-label small" for="permiteTextoLibreSub">
                                Permitir que el usuario escriba un detalle libre (ej. "Otro")
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-info fw-bold px-4">GUARDAR</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/app.js"></script>
    <script src="/js/admin-categorias.js"></script>
</body>
</html>
