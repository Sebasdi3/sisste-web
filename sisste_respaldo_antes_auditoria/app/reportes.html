<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISSTe - Reportes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/solicitud-panel.css">
    <link rel="stylesheet" href="/css/admin-users.css">

    <style>
        html, body { height: 100%; }
        body { overflow: hidden; }

        .config-shell {
            display: flex;
            height: calc(100vh - 90px);
            background-color: rgba(15, 23, 42, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin: 0 24px 24px 24px;
        }

        .config-sidebar {
            width: 320px;
            min-width: 280px;
            background-color: rgba(15, 23, 42, 0.7);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
        }
        .config-sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .config-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background-color 0.15s;
            color: #e2e8f0;
        }
        .config-item:hover { background-color: rgba(56, 189, 248, 0.08); }
        .config-item.activo {
            background-color: rgba(56, 189, 248, 0.15);
            border-left: 3px solid #38bdf8;
        }
        .config-item-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d9488, #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            flex-shrink: 0;
        }
        .config-item-texto { flex-grow: 1; }
        .config-item-titulo { font-weight: 600; font-size: 0.95rem; }
        .config-item-subtitulo { font-size: 0.78rem; color: #94a3b8; }

        .config-detalle {
            flex-grow: 1;
            overflow-y: auto;
            padding: 28px 32px;
        }
        .config-detalle-vacio {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
            text-align: center;
        }
        .config-detalle-vacio i { font-size: 3.5rem; margin-bottom: 16px; opacity: 0.4; }

        .reporte-total { text-align: center; padding: 24px; }
        .reporte-total .numero {
            font-size: 3rem;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
        .reporte-total .etiqueta {
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }
        .fila-reporte {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            padding: 10px 16px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .fila-reporte .cantidad {
            font-weight: bold;
            color: #38bdf8;
            background-color: rgba(56, 189, 248, 0.15);
            border-radius: 20px;
            padding: 2px 14px;
        }
        .bucket-card {
            text-align: center;
            padding: 16px;
            border-radius: 10px;
            background-color: rgba(15, 23, 42, 0.6);
        }
        .bucket-card .numero { font-size: 1.8rem; font-weight: 800; }
        .bucket-card .etiqueta { font-size: 0.75rem; color: #94a3b8; }

        @media (max-width: 700px) {
            .config-shell { flex-direction: column; height: auto; margin: 0 12px 12px 12px; }
            .config-sidebar { width: 100%; max-height: 240px; }
        }
    </style>
</head>
<body>

    <div class="container-fluid mt-3">
        <h1 class="titulo-neon">Reportes</h1>

        <div class="d-flex justify-content-end px-4 mb-3">
            <button onclick="history.back()" class="btn btn-outline-light btn-sm shadow me-2">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </button>
            <div class="me-3 text-white d-flex align-items-center">
                <i class="bi bi-person-circle me-2 text-info"></i>
                <span id="nombreUsuarioNavbar" class="small fw-bold">Usuario</span>
            </div>
            <button onclick="window.cerrarSesion()" class="btn btn-danger btn-sm shadow">Cerrar Sesión</button>
        </div>

        <div class="config-shell">
            <div class="config-sidebar" id="configSidebar">
                <div class="config-sidebar-header">Tipos de Reporte</div>
            </div>
            <div class="config-detalle" id="configDetalle">
                <div class="config-detalle-vacio">
                    <i class="bi bi-file-earmark-bar-graph"></i>
                    <p>Selecciona un tipo de reporte de la izquierda.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/app.js"></script>
    <script src="/js/reportes.js"></script>
</body>
</html>
