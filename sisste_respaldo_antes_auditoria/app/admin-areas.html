<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISSTe - Administración de Áreas / Departamentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/solicitud-panel.css">
    <link rel="stylesheet" href="/css/admin-users.css">

    <style>
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .item-row.inactivo { opacity: 0.5; }
    </style>
</head>
<body>

    <div class="container-fluid mt-3">
        <h1 class="titulo-neon" id="tituloLista">Gestión de Áreas / Departamentos</h1>

        <div class="d-flex justify-content-end px-4 mb-3">
            <a href="/admin-users.html" class="btn btn-outline-light btn-sm shadow me-2">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
            <div class="me-3 text-white d-flex align-items-center">
                <i class="bi bi-person-badge me-2 text-info"></i>
                <span id="nombreUsuarioNavbar" class="small fw-bold">Administrador</span>
            </div>
            <button onclick="window.cerrarSesion()" class="btn btn-danger btn-sm shadow">Cerrar Sesión</button>
        </div>

        <div class="row px-3">
            <div class="col-lg-4 mb-4">
                <div class="card p-4 h-100 shadow">
                    <h3 class="mb-4 text-white" id="tituloNuevo">Nuevo/a Área</h3>
                    <form id="formNuevoItem">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-white small">NOMBRE</label>
                            <input type="text" id="nombreItem" class="form-control admin-form-input" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow">AGREGAR</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8 mb-4">
                <div class="card p-4 h-100 shadow">
                    <h3 class="mb-4 text-white">Lista de Áreas / Departamentos</h3>
                    <div id="listaItems"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/app.js"></script>
    <script>
        window.LISTA_SIMPLE_CONFIG = { apiPath: '/api/admin/areas', etiqueta: 'Área', ejemplo: 'Recursos Humanos' };
    </script>
    <script src="/js/admin-lista-simple.js"></script>
</body>
</html>
